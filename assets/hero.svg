<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111F"/>
    <stop offset="0.55" stop-color="#0B1730"/>
    <stop offset="1" stop-color="#06101D"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#3B82F6"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="photoClip">
    <rect x="835" y="28" width="325" height="374" rx="32"/>
  </clipPath>
</defs>

<rect x="4" y="4" width="1192" height="422" rx="30" fill="url(#bg)" stroke="#0EA5E9" stroke-width="2"/>

<g opacity=".18" stroke="#22D3EE">
