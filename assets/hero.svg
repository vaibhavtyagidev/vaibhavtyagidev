  <path d="M0 160 L600 0"/>
  <path d="M450 430 L1200 120"/>
  <path d="M650 430 L1200 200"/>
  <path d="M770 0 L1200 150"/>
</g>

<circle cx="760" cy="85" r="3" fill="#22D3EE" filter="url(#glow)"/>
<circle cx="795" cy="120" r="2" fill="#60A5FA"/>
<circle cx="730" cy="350" r="3" fill="#22D3EE"/>

<text x="70" y="78" fill="#CBD5E1" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="600">HELLO, I'M</text>
<text x="68" y="145" fill="#F8FAFC" font-family="Montserrat,Arial,sans-serif" font-size="66" font-weight="900">VAIBHAV</text>
