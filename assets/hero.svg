<text x="385" y="142" fill="#F8FAFC" font-family="Montserrat,Arial,sans-serif" font-size="19" font-weight="700">BTech CSE Student</text>
<text x="385" y="171" fill="#CBD5E1" font-family="Montserrat,Arial,sans-serif" font-size="18">Developer</text>
<text x="385" y="198" fill="#CBD5E1" font-family="Montserrat,Arial,sans-serif" font-size="18">Builder</text>

<text x="70" y="252" fill="#E2E8F0" font-family="Montserrat,Arial,sans-serif" font-size="19">Building useful software &amp; turning ideas into</text>
<text x="70" y="281" fill="#22D3EE" font-family="Montserrat,Arial,sans-serif" font-size="21" font-weight="800">real products.</text>

<g font-family="Montserrat,Arial,sans-serif" font-size="13" font-weight="700">
